<svg xmlns="http://www.w3.org/2000/svg" width="340" height="64" viewBox="0 0 340 64" role="img" aria-label="Jeevan — The Cozy Reel">
  <defs>
    <linearGradient id="jred" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f6121d"/>
      <stop offset="1" stop-color="#b00610"/>
    </linearGradient>
  </defs>
  <!-- Mark: red rounded square with a bold white J -->
  <rect x="0" y="0" width="64" height="64" rx="16" fill="url(#jred)"/>
  <text x="32" y="47" text-anchor="middle" font-family="Inter, Arial, Helvetica, sans-serif" font-size="42" font-weight="900" fill="#ffffff">J</text>
  <circle cx="50" cy="14" r="3" fill="#ffffff"/>
  <!-- Wordmark: JEEVAN -->
  <text x="80" y="38" font-family="Inter, Arial, Helvetica, sans-serif" font-size="34" font-weight="900" letter-spacing="2" fill="#ffffff">JEEVAN</text>
  <!-- Tagline: THE COZY REEL -->
  <text x="82" y="58" font-family="Inter, Arial, Helvetica, sans-serif" font-size="11" font-weight="600" letter-spacing="4.5" fill="#b3b3b3">THE COZY REEL</text>
</svg>
